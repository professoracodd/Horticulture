button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,textarea{-webkit-appearance:none;appearance:none}
a{color:#9cc6ff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* header + coach */
header.top{position:sticky;top:0;z-index:40;background:#0d2042;border-bottom:1px solid var(--line)}
.hwrap{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.01em;margin-right:auto}
.brand .lg{width:30px;height:30px;border-radius:8px;background:var(--panel3);display:grid;place-content:center;border:1px solid var(--line)}
.brand .lg svg{width:20px;height:24px}
.chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.chip.on{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.chip.done{color:var(--good)}
.chip svg{width:12px;height:12px}
.coach{background:#13294f;border-top:1px solid var(--line)}
.coach[hidden]{display:none}
.cwrap{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center}
.cwrap>div{flex:1;min-width:0}
.c-part{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.c-why{font-size:13px;color:var(--muted)}
.c-do{font-size:15px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel3);font-weight:600;font-size:15px}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn svg{width:18px;height:18px}
/* layout */
main{max-width:980px;margin:0 auto;padding:22px 16px 80px}
h1{font-size:30px;line-height:1.15;margin:0 0 10px;letter-spacing:-.02em}
h2{font-size:24px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
h3{font-size:17px;margin:0 0 8px}
p{margin:0 0 10px}
.lead{color:var(--text2);font-size:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
.panel.given{background:transparent;border-style:dashed}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;min-width:0}
label.f .l{font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--text2)}
label.f .h{font-size:13px;color:var(--muted)}
.inwrap{position:relative;display:block}
.inwrap i{position:absolute;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:15px;pointer-events:none}
.inwrap i.pre{left:12px}.inwrap i.suf{right:12px}
input[type=text],textarea{width:100%;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--text)}
.inwrap.has-pre input{padding-left:26px}.inwrap.has-suf input{padding-right:64px}
input:focus,textarea:focus{outline:none;border-color:#9cc6ff;box-shadow:0 0 0 3px rgba(156,198,255,.25)}
input:disabled,textarea:disabled{opacity:.8;background:transparent}
input.bad{border-color:var(--bad)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
.links a{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--panel3);color:var(--text);text-decoration:none;font-size:14px;border:1px solid var(--line)}
.links svg{width:14px;height:14px}
ul.list{margin:0;padding-left:20px}ul.list li{margin:3px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-of-type{border-top:0}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.tile span{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tile b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pos{color:var(--good)}.neg{color:var(--bad)}
.note{font-size:14px;color:var(--text2);background:var(--panel2);border-left:3px solid var(--gold);padding:8px 12px;border-radius:0 10px 10px 0;margin:10px 0}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--gold);font-weight:600}
.lock svg{width:14px;height:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;vertical-align:top}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.tw{overflow-x:auto}
.swatch{display:inline-block;width:26px;height:0;border-top:3px solid;vertical-align:middle;margin-right:8px}
.ok{color:var(--good);font-weight:600}.short{color:var(--bad);font-weight:600}
/* start */
.start{max-width:640px;margin:20px auto}
.start ol{padding-left:20px;color:var(--text2)}
/* questions */
.q{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.q.locked{opacity:.5}
.q legend{font-weight:700;font-size:16px;margin-bottom:10px;padding:0}
.q fieldset{border:0;margin:0;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border-radius:12px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:15px}
.opt .lt{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-content:center;background:var(--panel3);font-weight:800;font-size:13px}
.opt.wrong{text-decoration:line-through;opacity:.6}
.opt.right{border-color:var(--good);background:rgba(74,222,128,.1)}
.fb{font-size:14px;margin-top:6px}
.fb.no{color:var(--bad)}.fb.yes{color:var(--good)}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--text2);margin:8px 0 0}

.h{font-size:13px;color:var(--muted)}
.cellchips{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:flex;gap:12px;align-items:flex-start;grid-column:1/-1;padding:12px 14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);cursor:pointer}
.chk input{-webkit-appearance:auto;appearance:auto;width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:#d6ba6e}
.chk span{display:flex;flex-direction:column;gap:2px}
.cc{min-width:58px;min-height:44px;padding:8px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:16px;color:var(--text)}
.cc.on{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.cc:disabled{opacity:.6}
.helpbtn{display:inline-flex;align-items:center;gap:5px;margin-left:6px;padding:3px 10px;border-radius:999px;background:var(--panel3);border:1px solid var(--line);color:var(--text);font-size:13px;font-weight:600;min-height:30px}
.helpbtn svg{width:15px;height:15px}
dialog#dlg{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog#dlg::backdrop{background:rgba(4,12,26,.75)}
.dlg{padding:20px}.dlg h2{font-size:20px}
ol.steps{padding-left:22px}ol.steps li{margin:6px 0}
.price-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.price-top .l{font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--text2)}
.bigp{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:10px 0 0;border-radius:18px}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--panel3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--gold);margin-top:-10px;border:2px solid #fff}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--panel3)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--gold);border:2px solid #fff}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bp>svg{width:100%;height:auto;display:block}
.bp .legend svg{flex:none;vertical-align:middle;margin-right:6px}
@keyframes flashRing{0%,100%{outline-color:rgba(255,255,255,0)}20%,60%{outline-color:#fff}40%,80%{outline-color:rgba(214,186,110,1)}}
.flash{outline:4px solid #fff;outline-offset:4px;animation:flashRing 1.8s ease-in-out!important}
@media (prefers-reduced-motion:reduce){.flash{animation:none!important}}
/* guide pulse */
@keyframes guidePulse{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.18),0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 26px 8px rgba(255,255,255,.45)}}
.guide{animation:guidePulse 1.5s ease-in-out infinite!important;position:relative;z-index:2}
@media (prefers-reduced-motion:reduce){.guide{animation:none!important;box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 18px 4px rgba(255,255,255,.4)!important}}
@media (max-width:700px){.grid,.grid3{grid-template-columns:minmax(0,1fr)}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:25px}.cwrap{flex-wrap:wrap}.chips{width:100%}}
</style>
</head>

function blueprintSVG(P){const W=900,pad=34,sc=(W-2*pad)/P.L,H=Math.round(P.W*sc+2*pad+30);const x0=pad,y0=pad;

  <rect x="0" y="0" width="${W}" height="${H}" fill="#0d2a63" rx="10"/><rect x="${x0}" y="${y0}" width="${P.L*sc}" height="${P.W*sc}" fill="url(#grid)" stroke="#fff" stroke-width="2"/>${out}
  <text x="${x0+P.L*sc/2}" y="${y0-10}" fill="#d3def2" font-size="13" text-anchor="middle">${n1(P.L)} ft</text>
  <text x="${x0-10}" y="${y0+P.W*sc/2}" fill="#d3def2" font-size="13" text-anchor="middle" transform="rotate(-90 ${x0-10} ${y0+P.W*sc/2})">${n1(P.W)} ft</text>
  <text x="${x0}" y="${H-12}" fill="#d3def2" font-size="12">${DEF.benchW} ft benches · ${DEF.aisle} ft aisles · 1 square = 1 ft · ${int(P.area)} sq ft</text></svg>

const CROWS=[['Plant',r=>r.k==='D'?S.shared.seedPlant:r.k==='B'?S.runs.B.plant:S.shared.plant],['Cuttings or seed per plug tray',r=>money(r.src)],['Labor per plug tray',r=>money(r.parts[4][2])],['Weeks mist + open',r=>`${n1(r.mw)} + ${n1(r.ow)}`],

function chartSVG(R){const W=900,H=380,ml=78,mr=20,mt=16,mb=44,S2=R.map(series);let lo=Math.min(0,...S2.flat()),hi=Math.max(0,...S2.flat());const pad=(hi-lo)*0.06||1;lo-=pad;hi+=pad;

function buildQs(){const R={};RK.forEach(k=>R[k]=calc(k));const L=k=>`Run ${k}: ${RUNS[k].n}`,runOpts=RK.map(L);
  const by=f=>RK.slice().sort((a,b)=>f(R[b])-f(R[a]));
  const key=t=>num(String(t).split(':').pop());const numOpts=(v,fmt,mults)=>{const uniq=[...new Set([v,...mults.map(m=>v*m)].map(fmt))];let m=3;while(uniq.length<4){const x=fmt(v*m++);if(!uniq.includes(x))uniq.push(x);}return {opts:uniq.slice(0,4).sort((a,b)=>key(a)-key(b)),ans:fmt(v)};};
  const best=by(r=>r.profit)[0],worst=by(r=>r.profit)[3],cheap=by(r=>-r.perPlug)[0],srcHi=by(r=>r.src)[0];
  const gap=numOpts(R[best].profit-R[worst].profit,v=>money(v,0),[0.5,1.5,2.2]),stock=numOpts(R.A.stockArea,v=>int(v)+' sq ft',[0.5,2,3]);
  const nc=cells(),up=numOpts(0.05*nc,v=>money(v),[0.1,0.5,2]);
  const cGas=R.C.trips*R.C.trip/Math.max(1,R.C.batch),cLab=num(S.shared.wage)/DEF.C.collect*R.C.units;
  const hc=String(R.A.hold),hs=String(R.D.hold),holdOpts=v=>[...new Set(['0','1','2','3','4',v])].map(Number).sort((a,b)=>a-b).filter((x,i,a)=>a.length<=4||Math.abs(x-+v)<=2).slice(0,4).map(String);
  const P=plan(),ratio=n1(P.open/Math.max(1,P.mist)),ratioOpts=numOpts(P.open/Math.max(1,P.mist),v=>'1 : '+n1(v),[0.5,1.5,2.5]);
  return [
    {q:'Which run made the most profit a year?',opts:runOpts,ans:L(best),why:`${L(best)} made ${money(R[best].profit,0)} a year, the most of the four.`},
    {q:'Which run had the lowest cost per plug?',opts:runOpts,ans:L(cheap),why:`${L(cheap)} cost ${plugM(R[cheap].perPlug)} per plug.`},
    {q:'Which run spent the most on cuttings or seed for one plug tray?',opts:runOpts,ans:L(srcHi),why:`${L(srcHi)} spent ${money(R[srcHi].src)} per plug tray on cuttings or seed.`},
    {q:'Every run paid the same greenhouse bill for the year. Why did some runs pay more greenhouse cost per plug tray?',opts:['They made fewer plug trays a year to spread the bill over, or needed extra space','Their potting mix cost more','Seedlings need a warmer greenhouse','Bought-in cuttings include greenhouse rent'],ans:'They made fewer plug trays a year to spread the bill over, or needed extra space',why:'The bill is the same no matter what. Fewer plug trays a year, or extra space like a stock area, means each tray carries more of it.'},
    {q:`In your cutting runs, plug trays spend ${n1(R.A.mw)} weeks under mist and ${n1(R.A.ow)} weeks on the open bench. How many rounds are on the open bench at the same time?`,opts:holdOpts(hc),ans:hc,why:`${n1(R.A.ow)} weeks ÷ ${n1(R.A.mw)} weeks rounds up to ${hc}.`},
    {q:`In your seed run, plug trays spend ${n1(R.D.mw)} weeks under mist and ${n1(R.D.ow)} weeks on the open bench. How many rounds are on the open bench at the same time?`,opts:holdOpts(hs),ans:hs,why:`${n1(R.D.ow)} weeks ÷ ${n1(R.D.mw)} weeks rounds up to ${hs}.`},
    {q:'What mist to open bench ratio did your bench plan use?',opts:ratioOpts.opts,ans:ratioOpts.ans,why:`${int(P.mist)} plug trays under mist and ${int(P.open)} on open benches is 1 : ${ratio}. That keeps the mist bench full every round.`},
    {q:'About how much extra space did the mother stock run need for its stock plants?',opts:stock.opts,ans:stock.ans,why:`${int(R.A.stockPlants)} stock plants in #1 pots take about ${stock.ans}.`},
    {q:'In the collecting run, which cost more per plug tray?',opts:['The trips (gas and driving time)','Collecting the cuttings on site'],ans:cGas>cLab?'The trips (gas and driving time)':'Collecting the cuttings on site',why:`The trips were ${money(cGas)} per plug tray and collecting on site was ${money(cLab)}.`},
    {q:`If NC Farms raised its price by 5 cents per cutting, how much more would one ${nc}-cell plug tray cost?`,opts:up.opts,ans:up.ans,why:`Each plug tray uses ${nc} cuttings. ${nc} × $0.05 = ${up.ans}.`},
    {q:'How much more profit a year did your best run make than your worst run?',opts:gap.opts,ans:gap.ans,why:`${money(R[best].profit,0)} minus ${money(R[worst].profit,0)} is ${gap.ans}.`}];}

function openMixHelp(){const d=$('#dlg');d.innerHTML=`<div class="dlg"><h2 id="dlgH" tabindex="-1">Price per cubic yard from a bag price</h2>
  <p>Most mix is sold in bags or bales. The app needs the price for one cubic yard. A cubic yard is 27 cubic feet.</p>
  <ol class="steps"><li><b>Divide the cost of the bag by the cubic feet in the bag.</b> That's the cost of one cubic foot.</li><li><b>Multiply that by 27.</b> That's the cost of one cubic yard.</li></ol>
  <div class="note"><b>Example:</b> A 2 cu ft bag of mix costs $14.<br>$14 ÷ 2 cu ft = $7 per cu ft<br>$7 × 27 = <b>$189 per cu yd</b></div>
  <p class="h">Compressed bales: use the loose-fill volume on the label, not the compressed size. A bale labeled 3.8 cu ft compressed often fluffs up to 7 or 8 cu ft.</p>
  <h3>Try yours</h3><div class="grid"><label class="f" for="cBag"><span class="l">Cost of the bag</span><span class="inwrap has-pre"><i class="pre" aria-hidden="true">$</i><input type="text" id="cBag" inputmode="decimal"></span></label>
  <label class="f" for="cFt"><span class="l">Cubic feet in the bag</span><span class="inwrap has-suf"><input type="text" id="cFt" inputmode="decimal"><i class="suf" aria-hidden="true">cu ft</i></span></label></div>
  <div class="kv" style="margin-top:10px"><span>Price per cubic yard</span><b id="cOut">-</b></div>
  <div class="actions"><button class="btn primary" type="button" id="cUse" disabled>Use this price</button><button class="btn" type="button" data-close>Close</button></div></div>`;
  d.showModal();$('#dlgH').focus();}
function mixCalc(){const b=num(($('#cBag')||{}).value),f=num(($('#cFt')||{}).value);const v=b>0&&f>0?b/f*27:NaN;if($('#cOut'))$('#cOut').textContent=ok(v)?money(v)+' per cu yd':'-';if($('#cUse'))$('#cUse').disabled=!ok(v);return v;}

const VIEWS={start:vStart,setup:vSetup,timing:vTiming,space:vSpace,A:()=>vRun('A'),B:()=>vRun('B'),C:()=>vRun('C'),D:()=>vRun('D'),price:vPrice,compare:vCompare,questions:vQuestions,export:vExport};
function render(focus){$('#main').innerHTML=VIEWS[S.view]();renderChips();outputs();$('#coach').hidden=S.stage==='start';
  if(focus){const h=$('#main h1, #main h2');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}window.scrollTo(0,0);}queueGuide();}
function renderChips(){const cur=STAGES.findIndex(s=>s[0]===S.stage);
  $('#chips').innerHTML=STAGES.map(([id,l],i)=>{const done=S.done[id]||(id==='export'&&S.exported);
    return `<li><button type="button" class="chip${S.view===id?' on':''}${done?' done':''}" data-view="${id}"${i<=cur?'':' disabled'} aria-current="${S.view===id?'step':'false'}">${done?ICON.check:''}${l}</button></li>`;}).join('');}
function outputs(){const o=(n,h)=>$$(`[data-o="${n}"]`).forEach(e=>e.innerHTML=h);
  if(S.view==='timing'){const c=timing('A'),s=timing('D');o('cTot',ok(c.total)?n1(c.total)+' weeks':'-');o('sTot',ok(s.total)?n1(s.total)+' weeks':'-');}
  if(S.view==='space'){const P=plan();o('sqft',P?int(P.area)+' sq ft':'-');o('house',P?money(P.area*COST_SQFT,0)+' a year':'-');o('plan',planHTML());}
  RK.forEach(k=>{if(S.view===k)o('res-'+k,resHTML(k));});
  if(S.view==='price'){const p=num(S.price);o('pv',ok(p)?money(p):'-');o('pt',priceTable());}
  $$('input[data-k]').forEach(i=>{const f=(F[S.view]||[]).find(x=>x.k===i.dataset.k);const e=f&&fieldErr(f);i.classList.toggle('bad',!!(e&&e!=='blank'));});}

/* ---------- guidance: one glowing control at a time ---------- */
const PART={setup:['Part 1 of 9 · Setup','You enter these once, and every run uses them.'],timing:['Part 2 of 9 · Timing','How long your plants spend on each bench decides how big each bench needs to be.'],
  space:['Part 3 of 9 · Growing space','The right mist to open bench ratio keeps every spot earning.'],
  A:['Part 4 of 9 · Run A of 4','Mother stock: you grow the plants you cut from.'],B:['Part 5 of 9 · Run B of 4','Buying in: you pay a propagator for each cutting.'],C:['Part 6 of 9 · Run C of 4','Collecting: you pay with gas and your own time.'],
  D:['Part 7 of 9 · Run D of 4','Seed: cheap to start, can be slower to finish.'],price:['Part 8 of 9 · Price','One price for every run keeps the comparison fair.'],
  compare:['Part 9 of 9 · Compare','Same greenhouse, same benches, same price. Only the source changed.'],questions:['Part 9 of 9 · Questions','Your answers come from your own results.'],export:['Turn it in','Your PDF shows your results, your research and your answers.']};
function extra(st){if(st==='timing'){const c=timing('A'),s=timing('D');if(!firstBad('timing')&&(c.total>40||s.total>52))return {el:c.total>40?'#'+fid('time.cIrr'):'#'+fid('time.sIrr'),text:'That adds up to a very long time in a plug tray. Most plugs ship in under 20 weeks. Check your numbers.'};}
  if(st==='space'){const P=plan();if(P&&P.err)return {el:'#'+fid('space.W'),text:`That space is too small for a bench. Make it at least ${DEF.benchW+2*DEF.aisle} ft wide.`};if(P&&!(P.mist>0))return {el:'#'+fid('space.L'),text:'That space doesn\'t leave room for a mist bench. Make it bigger.'};}
  return null;}
function stageOK(st){if(F[st]&&firstBad(st))return false;if(extra(st))return false;if(st==='price')return S.priceSet&&ok(num(S.price));return true;}
function guideFor(){
  if(S.view==='start'){if(String(S.name).trim().length<3)return {el:'#name',text:'Type your first and last name.'};return {el:'#startBtn',text:'Click Start.'};}
  if(S.view!==S.stage)return {el:`[data-view="${S.stage}"]`,text:'You\'re looking back at an earlier part. Click the highlighted step to keep going.'};
  const st=S.stage;
  if(F[st]){const f=firstBad(st);if(f){const e=fieldErr(f);return {el:'#'+fid(f.k),text:e==='pick'?(f.k==='shared.cells'?'Pick how many cells your plug tray has.':'Pick how many seeds go in each cell.'):e==='blank'?`Enter the ${f.what}.`:e};}
    const x=extra(st);if(x)return x;
    return {el:'#next',text:{setup:'Click Save to lock these in for all four runs.',timing:'Check your totals, then plan your benches.',space:'Look over your bench plan, then lock it in.',A:'Look over your results, then save Run A.',B:'Look over your results, then save Run B.',C:'Look over your results, then save Run C.',D:'Look over your results, then save Run D.'}[st]};}
  if(st==='price')return S.priceSet?{el:'#next',text:'Happy with your price? Lock it in and compare.'}:{el:'#priceR',text:'Slide to pick your price per plug.'};
  if(st==='compare')return {el:'#next',text:'Read the table and the chart, then go to the questions.'};
  if(st==='questions'){const i=S.qs.findIndex((q,j)=>!(S.qa[j]&&S.qa[j].right));if(i>=0)return {el:`#q${i}`,text:`Answer question ${i+1} of ${S.qs.length}.`};return {el:'[data-view="export"]',text:'All of them are right. Go to the PDF step.'};}
  if(st==='export')return S.exported?{el:null,text:`Done. Turn in ${S.pdfName}.`}:{el:'#pdfBtn',text:'Save your PDF.'};
  return {el:null,text:''};}
let queued=false,lastEl=null;
function queueGuide(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;refreshGuide();});}
function refreshGuide(){const nb=$('#next');if(nb)nb.disabled=!stageOK(S.stage);const sb=$('#startBtn');if(sb)sb.disabled=String(S.name).trim().length<3;
  const g=$('#dlg').open?{el:null,text:''}:guideFor();const el=g.el?$(g.el):null;if(el!==lastEl){$$('.guide').forEach(n=>n.classList.remove('guide'));if(el)el.classList.add('guide');lastEl=el;}
  const p=PART[S.view]||['',''];$('#cPart').textContent=p[0];$('#cWhy').textContent=p[1];if(g.text)$('#cDo').textContent=g.text;}
['click','input','change','keyup'].forEach(ev=>document.addEventListener(ev,queueGuide));
$('#showMe').addEventListener('click',()=>{refreshGuide();const el=$('.guide');if(!el)return;
  const top=el.getBoundingClientRect().top+window.scrollY-$('header.top').offsetHeight-Math.max(24,(window.innerHeight-$('header.top').offsetHeight-el.offsetHeight)/3);

  const f=el.matches('input,button,textarea,select')?el:el.querySelector('input:not(:disabled),button:not(:disabled)');if(f&&!f.disabled)setTimeout(()=>f.focus({preventScroll:true}),450);});

/* ---------- events ---------- */
document.addEventListener('input',e=>{const t=e.target;if(t.id==='name'){S.name=t.value;return;}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='name'&&String(S.name).trim().length>=3){e.preventDefault();act('start');}});
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v&&!v.disabled){S.view=v.dataset.view;render(true);return;}

  if(e.target.id==='cUse'){const v=mixCalc();if(ok(v)){S.shared.mix=v.toFixed(2);$('#dlg').close();const y=window.scrollY;render(false);window.scrollTo(0,y);}return;}
  const a=e.target.closest('[data-act]');if(a&&!a.disabled){act(a.dataset.act);return;}
  const o=e.target.closest('.opt');if(o&&!o.disabled)answer(+o.dataset.q,o.dataset.o);});
$('#dlg').addEventListener('close',()=>{queueGuide();const b=$('[data-help]');if(b)b.focus();});
function act(a){
  if(a==='start'){if(String(S.name).trim().length<3)return;S.name=S.name.trim();S.startedAt=Date.now();S.visSince=document.visibilityState==='visible'?Date.now():null;S.stage=S.view='setup';render(true);return;}
  if(a==='next'){const st=S.stage;if(!stageOK(st))return;S.done[st]=true;const i=STAGES.findIndex(s=>s[0]===st);const nx=STAGES[i+1][0];if(nx==='questions'&&!S.qs)S.qs=buildQs();S.stage=S.view=nx;render(true);return;}
  if(a==='pdf')exportPDF();}
function answer(i,o){const q=S.qs[i];const a=S.qa[i]||(S.qa[i]={tries:0,wrong:[],right:false});if(a.right)return;a.tries++;
  if(o===q.ans){a.right=true;a.first=a.tries===1;}else a.wrong.push(o);
  const y=window.scrollY;render(false);window.scrollTo(0,y);
  if(a.right&&S.qs.every((q,j)=>S.qa[j]&&S.qa[j].right)){S.done.questions=true;S.stage='export';renderChips();queueGuide();}}
document.addEventListener('visibilitychange',()=>{if(!S.startedAt)return;if(document.visibilityState==='hidden'){if(S.visSince){S.visMs+=Date.now()-S.visSince;S.visSince=null;}}else S.visSince=Date.now();});
window.addEventListener('beforeunload',e=>{if(S.startedAt&&!S.exported){e.preventDefault();e.returnValue='';}});
const visible=()=>S.visMs+(S.visSince?Date.now()-S.visSince:0);
const dur=ms=>{const m=Math.round(ms/60000);return m<60?m+' min':Math.floor(m/60)+' hr '+(m%60)+' min';};

/* ---------- PDF ---------- */
const lat=s=>String(s==null?'':s).replace(/[\u2013\u2014]/g,'-').replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/\u2192/g,'->').replace(/[^\x00-\xff]/g,'');
function exportPDF(){const J=window.jspdf;if(!J||!J.jsPDF){alert('The PDF tool did not load. Reload the page and try again.');return;}
  const doc=new J.jsPDF({unit:'pt',format:'letter'}),W=612,H=792,M=46;const R=RK.map(calc);const amber=[201,150,40];const P=plan();

  let y=90;info.forEach(([a,b],i)=>{const x=M+(i%2)*((W-2*M)/2);if(i%2===0&&i)y+=16;doc.setFont('helvetica','bold');doc.text(lat(a)+':',x,y);const lw=doc.getTextWidth(lat(a)+':  ');doc.setFont('helvetica','normal');doc.text(doc.splitTextToSize(lat(b),(W-2*M)/2-lw-6)[0],x+lw,y);});
  y+=26;doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('Results',M,y);y+=8;

    x=M;cells.forEach((c,i)=>{doc.setFont('helvetica',i===0?'bold':'normal');doc.text(c,x+4,y+12);x+=cols[i][1];});y+=rh;});
  doc.setDrawColor(200);doc.setLineWidth(.5);doc.line(M,y,W-M,y);
  y+=24;doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('Profit over the first year',M,y);y+=10;
  const cx=M+54,cw=W-M-cx-14,ch=180,S2=R.map(series);let lo=Math.min(0,...S2.flat()),hi=Math.max(0,...S2.flat());const pad=(hi-lo)*0.06||1;lo-=pad;hi+=pad;
  const X=w=>cx+cw*w/52,Y=v=>y+ch*(hi-v)/(hi-lo);const step=niceStep((hi-lo)/5);
  doc.setFontSize(8);doc.setFont('helvetica','normal');for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){doc.setDrawColor(225);doc.setLineWidth(.4);doc.line(cx,Y(v),cx+cw,Y(v));doc.setTextColor(90);doc.text(lat(money(v,0)),cx-6,Y(v)+3,{align:'right'});}
  doc.setDrawColor(60);doc.setLineWidth(1);doc.line(cx,Y(0),cx+cw,Y(0));[0,13,26,39,52].forEach(w=>doc.text('Week '+w,X(w),y+ch+12,{align:w===0?'left':w===52?'right':'center'}));doc.setTextColor(0);
  R.forEach((r,i)=>{doc.setDrawColor(...RUNS[r.k].pdfCol);doc.setLineWidth(1.8);doc.setLineDashPattern(RUNS[r.k].pdfDash,0);for(let w=1;w<=52;w++)doc.line(X(w-1),Y(S2[i][w-1]),X(w),Y(S2[i][w]));});
  doc.setLineDashPattern([],0);y+=ch+28;let lx=M;RK.forEach(k=>{doc.setDrawColor(...RUNS[k].pdfCol);doc.setLineWidth(1.8);doc.setLineDashPattern(RUNS[k].pdfDash,0);doc.line(lx,y-3,lx+24,y-3);doc.setLineDashPattern([],0);doc.setFontSize(8.5);doc.text(lat('Run '+k+': '+RUNS[k].n),lx+28,y);lx+=(W-2*M)/4;});
  // bench plan page
  doc.addPage();title('Your bench plan',58);y=86;doc.setFont('helvetica','normal');doc.setFontSize(10);
  doc.text(lat(`${n1(P.L)} x ${n1(P.W)} ft growing space, ${int(P.area)} sq ft. ${P.n} benches, ${n1(P.len)} x ${DEF.benchW} ft, with ${DEF.aisle} ft aisles.`),M,y);y+=14;
  doc.text(lat(`${int(P.mist)} plug trays under mist and ${int(P.open)} on open benches (1 : ${n1(P.open/Math.max(1,P.mist))}).`),M,y);y+=16;
  const sc=Math.min((W-2*M)/P.L,300/P.W),bx0=M,by0=y;doc.setDrawColor(30);doc.setLineWidth(1.2);doc.rect(bx0,by0,P.L*sc,P.W*sc);
  const gap=(P.W-DEF.aisle-P.n*(DEF.benchW+DEF.aisle))/2;let ml=P.mist;
  for(let i=0;i<P.n;i++){const by=by0+(gap+DEF.aisle+i*(DEF.benchW+DEF.aisle))*sc,bx=bx0+DEF.aisle*sc,bw=P.len*sc,bh=DEF.benchW*sc;const m=Math.min(P.T,ml);ml-=m;const mw=bw*m/P.T;
    if(mw>0){doc.setFillColor(200,220,248);doc.setDrawColor(42,120,214);doc.rect(bx,by,mw,bh,'FD');}if(mw<bw){doc.setFillColor(214,240,222);doc.setDrawColor(20,138,96);doc.rect(bx+mw,by,bw-mw,bh,'FD');}}
  y=by0+P.W*sc+16;doc.setFillColor(200,220,248);doc.setDrawColor(42,120,214);doc.rect(M,y-8,12,9,'FD');doc.setTextColor(0);doc.text('Mist',M+16,y);doc.setFillColor(214,240,222);doc.setDrawColor(20,138,96);doc.rect(M+60,y-8,12,9,'FD');doc.text('Open bench',M+76,y);
  y+=24;
  const line=(a,b)=>{if(y>H-70){doc.addPage();y=58;}doc.setFontSize(9.5);doc.setFont('helvetica','bold');const la=doc.splitTextToSize(lat(a),190);doc.text(la,M,y);doc.setFont('helvetica','normal');const lb=doc.splitTextToSize(lat(b),W-2*M-200);doc.text(lb,M+200,y);y+=Math.max(la.length,lb.length)*12+4;};
  const head=t=>{if(y>H-90){doc.addPage();y=58;}y+=6;doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text(lat(t),M,y);y+=16;};

  line('From seed',`${n1(ts.mw)} weeks under mist, ${n1(ts.irr)} under irrigation, ${n1(ts.hard)} hardening off`);line('Seed times source',S.time.sSrc);

  line('Run C trip',`${S.runs.C.miles} miles round trip, gas ${money(num(S.runs.C.gas))}/gal, trip cost ${money(R[2].trip)} with driving time, ${int(R[2].trips)} trips per round. Source: ${S.runs.C.src}`);

  S.qs.forEach((q,i)=>{const a=S.qa[i];doc.setFontSize(10);doc.setFont('helvetica','bold');const ql=doc.splitTextToSize(lat((i+1)+'. '+q.q),W-2*M);if(y+ql.length*12+48>H-60){doc.addPage();y=58;}
    doc.text(ql,M,y);y+=ql.length*12+2;doc.setFont('helvetica','normal');doc.text(lat('Answer: '+q.ans),M+14,y);y+=13;
    if(a.wrong.length){const wl=doc.splitTextToSize(lat('Also tried: '+a.wrong.join('; ')),W-2*M-14);doc.setTextColor(120);doc.text(wl,M+14,y);doc.setTextColor(0);y+=wl.length*12;}

  const fn=('Plug Lab Assignment - '+S.name).replace(/[\\/:*?"<>|]+/g,'').trim()+'.pdf';

render(true);
window.__lab={S,calc,act,buildQs,series,plan,timing,render};
