<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plant Science Midterm Match</title>
<style>
  /* ===== EDIT YOUR PAIRS IN THE <script> BELOW (look for const PAIRS) ===== */
  :root{
    --bg:#f3f5ef;
    --panel:#ffffff;
    --ink:#17251a;
    --muted:#465448;
    --cover:#1d4a28;
    --cover-2:#2a6236;
    --cover-line:#9fd1a8;
    --term:#0f4c26;      /* term band: dark green */
    --clue:#123a6b;      /* clue band: navy */
    --match:#1b6b33;
    --match-bg:#e4f2e7;
    --miss:#b3261e;
    --focus:#f2b705;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.3;
  }
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  header{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
    margin-bottom:14px;
  }
  h1{font-size:1.35rem;margin:0;color:var(--cover)}
  .sub{margin:2px 0 0;color:var(--muted);font-size:.92rem}
  .stats{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .stat{
    background:var(--panel);border:1px solid #d6dccf;border-radius:999px;
    padding:6px 12px;font-size:.92rem;font-weight:600;
  }
  .btn{
    font:inherit;font-weight:700;font-size:.95rem;
    background:var(--cover);color:#fff;border:0;border-radius:999px;
    padding:8px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{background:var(--cover-2)}
  .btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .btn svg{width:16px;height:16px}

  .grid{
    display:grid;gap:12px;
    grid-template-columns:repeat(4,1fr);
  }
  @media (max-width:640px){
    .grid{grid-template-columns:repeat(3,1fr);gap:8px}
    .wrap{padding:10px}
  }
  @media (max-width:360px){
    .grid{grid-template-columns:repeat(2,1fr)}
  }

  .card{
    position:relative;aspect-ratio:4/5;
    border:0;padding:0;background:none;cursor:pointer;
    perspective:900px;border-radius:var(--radius);
    font:inherit;color:inherit;
  }
  .card:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
  .inner{
    position:absolute;inset:0;
    transform-style:preserve-3d;
    transition:transform .45s ease;
    border-radius:var(--radius);
  }
  .card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;border-radius:var(--radius);
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  /* Face-down side */
  .back{
    background:
      radial-gradient(circle at 30% 20%,rgba(255,255,255,.08),transparent 55%),
      linear-gradient(160deg,var(--cover-2),var(--cover));
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    color:#eaf6ec;
  }
  .back svg{width:42%;height:auto;opacity:.95}
  .back span{
    font-size:clamp(.6rem,1.6vw,.8rem);letter-spacing:.14em;text-transform:uppercase;font-weight:700;
  }
  .card:hover:not(.flipped):not(.matched) .back{filter:brightness(1.12)}

  /* Face-up side */
  .front{
    transform:rotateY(180deg);
    background:var(--panel);
    border:3px solid #cfd6cb;
    display:flex;flex-direction:column;
  }
  .band{
    color:#fff;font-weight:800;font-size:clamp(.6rem,1.5vw,.75rem);
    letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;text-align:center;
  }
  .front.term .band{background:var(--term)}
  .front.clue .band{background:var(--clue)}
  .text{
    flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
    padding:8px 6px;overflow:hidden;font-weight:600;color:var(--ink);
    min-width:0;
  }
  .text span{display:block;max-width:100%;word-break:normal}
  .front.term .text{font-size:clamp(1rem,3vw,1.5rem);font-weight:800;color:var(--term)}
  .front.clue .text{font-size:clamp(.78rem,2vw,1rem)}

  .card.matched .front{border-color:var(--match);background:var(--match-bg)}
  .card.matched{cursor:default}
  .check{
    position:absolute;right:6px;bottom:6px;width:24px;height:24px;
    border-radius:50%;background:var(--match);display:none;
    align-items:center;justify-content:center;
  }
  .check svg{width:14px;height:14px}
  .card.matched .check{display:flex}
  .card.miss .front{border-color:var(--miss)}

  /* Congratulations */
  .overlay{
    position:fixed;inset:0;background:rgba(15,30,18,.55);
    display:none;align-items:center;justify-content:center;padding:16px;z-index:10;
  }
  .overlay.show{display:flex}
  .modal{
    background:var(--panel);border-radius:18px;padding:28px 24px;max-width:420px;width:100%;
    text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3);
  }
  .modal svg{width:84px;height:84px}
  .modal h2{margin:10px 0 6px;font-size:1.8rem;color:var(--cover)}
  .modal p{margin:0 0 18px;color:var(--muted);font-size:1.05rem}

  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  @media (prefers-reduced-motion:reduce){
    .inner{transition:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="gameTitle">Plant Science Midterm Match</h1>
      <p class="sub">Flip two cards. Match each term with its clue.</p>
    </div>
    <div class="stats">
      <span class="stat" id="pairsStat">Pairs: 0 / 0</span>
      <span class="stat" id="triesStat">Tries: 0</span>
      <button class="btn" id="restartBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        Restart
      </button>
    </div>
  </header>

  <div class="grid" id="grid" role="group" aria-labelledby="gameTitle"></div>
  <div class="sr-only" aria-live="polite" id="live"></div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="congratsTitle">
  <div class="modal">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="30" fill="#e4f2e7"/>
      <path d="M32 50V26" stroke="#1b6b33" stroke-width="3" stroke-linecap="round"/>
      <path d="M32 34c-9 0-15-6-15-15 9 0 15 6 15 15z" fill="#2a8a45"/>
      <path d="M32 28c0-9 6-15 15-15 0 9-6 15-15 15z" fill="#1b6b33"/>
      <path d="M22 50h20" stroke="#1b6b33" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <h2 id="congratsTitle">Congratulations!</h2>
    <p id="congratsMsg"></p>
    <button class="btn" id="againBtn" type="button">Play again</button>
  </div>
</div>

<script>
/* =========================================================
   EDIT YOUR MIDTERM PAIRS HERE.
   Each pair = one term card + one clue card.
   Add or remove pairs freely; the grid adjusts automatically.
   ========================================================= */
const PAIRS = [
  { term: "Mitochondria",     clue: "Organelle where cellular respiration produces most of the cell's ATP." },
  { term: "Photosynthesis",   clue: "Process that uses light energy to convert CO\u2082 and water into sugar." },
  { term: "Plant growth",     clue: "Cell division + cell elongation." },
  { term: "Auxin",            clue: "Hormone responsible for apical dominance; manipulated by pruning." },
  { term: "Osmosis",          clue: "Movement of water across a selectively permeable membrane." },
  { term: "Photorespiration", clue: "Rubisco binds O\u2082 instead of CO\u2082 in C3 plants, causing a loss of fixed carbon." }
];
const FLIP_BACK_MS = 1300; // how long a wrong pair stays visible before flipping back

const leafSVG = '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 52C12 28 28 12 52 12c0 24-16 40-40 40z"/><path d="M12 52L40 24"/><path d="M24 40h10M30 34h8M20 44v-8"/></svg>';
const checkSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

const grid = document.getElementById('grid');
const live = document.getElementById('live');
const pairsStat = document.getElementById('pairsStat');
const triesStat = document.getElementById('triesStat');
const overlay = document.getElementById('overlay');
const congratsMsg = document.getElementById('congratsMsg');

let first = null, second = null, lock = false, tries = 0, matched = 0;

function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function build(){
  first = second = null; lock = false; tries = 0; matched = 0;
  overlay.classList.remove('show');
  const deck = [];
  PAIRS.forEach((p,i)=>{
    deck.push({pair:i,kind:'term',text:p.term});
    deck.push({pair:i,kind:'clue',text:p.clue});
  });
  shuffle(deck);
  grid.innerHTML = '';
  deck.forEach((c,idx)=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'card';
    b.dataset.pair = c.pair;
    b.dataset.kind = c.kind;
    b.dataset.text = c.text;
    b.dataset.n = idx+1;
    b.innerHTML =
      '<div class="inner">' +
        '<div class="face back">' + leafSVG + '<span>Plant Science</span></div>' +
        '<div class="face front ' + c.kind + '">' +
          '<div class="band">' + (c.kind==='term' ? 'Term' : 'Clue') + '</div>' +
          '<div class="text"><span>' + esc(c.text) + '</span></div>' +
          '<div class="check">' + checkSVG + '</div>' +
        '</div>' +
      '</div>';
    setLabel(b);
    b.addEventListener('click',()=>flip(b));
    grid.appendChild(b);
  });
  updateStats();
  live.textContent = 'New game. ' + deck.length + ' cards face down.';
  requestAnimationFrame(fitAll);
}

function setLabel(b){
  const n = b.dataset.n;
  if(b.classList.contains('matched')){
    b.setAttribute('aria-label','Card '+n+', matched '+b.dataset.kind+': '+b.dataset.text);
  } else if(b.classList.contains('flipped')){
    b.setAttribute('aria-label','Card '+n+', '+b.dataset.kind+': '+b.dataset.text);
  } else {
    b.setAttribute('aria-label','Card '+n+', face down');
  }
}

function flip(b){
  if(lock || b===first || b.classList.contains('matched')) return;
  b.classList.add('flipped');
  setLabel(b);
  if(!first){
    first = b;
    live.textContent = b.dataset.kind + ': ' + b.dataset.text;
    return;
  }
  second = b;
  tries++;
  updateStats();
  const isMatch = first.dataset.pair === second.dataset.pair;
  if(isMatch){
    [first,second].forEach(c=>{c.classList.remove('flipped');c.classList.add('matched');c.setAttribute('aria-disabled','true');setLabel(c);});
    matched++;
    updateStats();
    live.textContent = b.dataset.kind + ': ' + b.dataset.text + '. Match! ' + matched + ' of ' + PAIRS.length + ' pairs found.';
    first = second = null;
    if(matched === PAIRS.length) setTimeout(win, 700);
  } else {
    lock = true;
    first.classList.add('miss'); second.classList.add('miss');
    live.textContent = b.dataset.kind + ': ' + b.dataset.text + '. Not a match.';
    setTimeout(()=>{
      [first,second].forEach(c=>{c.classList.remove('flipped','miss');setLabel(c);});
      first = second = null; lock = false;
    }, FLIP_BACK_MS);
  }
}

function updateStats(){
  pairsStat.textContent = 'Pairs: ' + matched + ' / ' + PAIRS.length;
  triesStat.textContent = 'Tries: ' + tries;
}

function win(){
  congratsMsg.textContent = 'You matched all ' + PAIRS.length + ' pairs in ' + tries + ' tries.';
  overlay.classList.add('show');
  document.getElementById('againBtn').focus();
}

/* Shrink long clue text so it always fits inside its card */
function fitAll(){
  document.querySelectorAll('.text').forEach(box=>{
    const span = box.firstElementChild;
    span.style.fontSize = '';
    let size = parseFloat(getComputedStyle(span).fontSize);
    let guard = 0;
    const over = () => box.scrollHeight > box.clientHeight || span.scrollWidth > box.clientWidth - 12;
    while(over() && size > 8 && guard < 80){
      size -= 0.5; span.style.fontSize = size + 'px'; guard++;
    }
    // last resort on very narrow screens: allow a long word to wrap
    span.style.overflowWrap = over() ? 'anywhere' : '';
  });
}
let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(fitAll,150);});

document.getElementById('restartBtn').addEventListener('click',build);
document.getElementById('againBtn').addEventListener('click',()=>{build();grid.querySelector('.card').focus();});
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && overlay.classList.contains('show')) overlay.classList.remove('show'); });

build();
</script>
</body>
</html>
